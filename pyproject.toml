[project]
name = "meridian"
version = "0.1.0"
description = "An e-commerce analytics platform demonstrating the data engineering stack end to end"
requires-python = ">=3.11"

# Runtime dependencies of the pipeline itself. Deliberately small: the seed
# generator is stdlib-only, and `pip install -e .` must not drag in the AI or
# web stacks for someone who only wants to generate source data.
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "PyYAML>=6.0",
    # The lake engine and the transport for the Silver->warehouse hop. Core
    # rather than optional: without them Bronze and Silver are unreadable, since
    # dbt-postgres cannot read Parquet from object storage (CONTRACTS.md §3).
    "duckdb>=1.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
# The Phase 1 AI layer. `anthropic` is here rather than in `rag` core because
# retrieval works without it — CONTRACTS.md keeps the platform functional with
# no ANTHROPIC_API_KEY set, answering extractively from retrieved passages.
rag = [
    "fastembed>=0.4",
    "anthropic>=0.40",
]
# Phase 5. Optional for the same reason as `rag`: the batch platform is complete
# without a broker, and `pip install -e .` should not pull librdkafka for
# someone who only wants to run the pipeline.
stream = [
    "confluent-kafka>=2.5",
    # Avro, without a Schema Registry. fastavro rather than the reference
    # `avro` package: it is an order of magnitude faster at the per-message
    # encode this does thousands of times, and ships manylinux wheels.
    "fastavro>=1.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The components that own a schema ship its DDL inside the package and apply it
# at startup: the indexer owns `rag` (CONTRACTS.md §11) and the pipeline owns
# meta/silver/secure (§12). Without this those files survive an editable install
# and vanish from a wheel.
#
# A glob rather than a package-by-package list, because the narrow version was
# already wrong once: `meridian.rag` was listed, `meridian.warehouse` was added
# later, and nothing noticed until a task ran from an installed copy inside the
# Airflow image and died on a missing warehouse/ddl.sql. From a source checkout
# the file is simply there, so every local run and every test passed.
[tool.setuptools.package-data]
"*" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# ruff format expands any collection carrying a magic trailing comma to one item
# per line. In these two modules that would turn deliberately hand-aligned data
# tables — 48 first names laid out 8 to a row, the 12-month seasonality curve
# written as two readable rows — into ~160 lines of one-per-line noise. They are
# data, formatted to be read as data, and the formatter has no way to know that.
# Everything else in the tree is formatted.
exclude = [
    "src/meridian/seed/config.py",
    "src/meridian/seed/identity.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
