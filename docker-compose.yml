# Meridian local stack.
#
# Profiles keep the footprint honest. `core` is everything Phase 1 needs and
# nothing else — Postgres and MinIO, about 700 MB resident. Later phases add
# `full` (Redpanda, Airflow, the API, the dashboard), which peaks around 6.5 GB.
# Running one profile must never require standing up the other.
#
#   docker compose --profile core up -d
#
# Every value comes from .env (copy .env.example). Nothing here carries a
# default credential: an unset password fails the init scripts loudly rather
# than silently creating a role with a blank password.

name: meridian

services:
  # --------------------------------------------------------------------------
  # Postgres. pgvector/pgvector:pg16, NOT postgres:16-alpine.
  #
  # CONTRACTS.md §1: the alpine image has no pgvector, and the failure surfaces
  # much later as a confusing "type vector does not exist" from the indexer
  # rather than at startup. The healthcheck below asserts the extension is
  # actually present, so a wrong image fails here instead of in Phase 1 code.
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [core, full]
    container_name: meridian-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?set POSTGRES_SUPERUSER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Read by db/init/04_roles.sql through psql's \getenv, so role passwords
      # are never written into a file in this repo.
      MERIDIAN_APP_PASSWORD: ${MERIDIAN_APP_PASSWORD:?set MERIDIAN_APP_PASSWORD in .env}
      MERIDIAN_ETL_PASSWORD: ${MERIDIAN_ETL_PASSWORD:?set MERIDIAN_ETL_PASSWORD in .env}
      DBT_RUNNER_PASSWORD: ${DBT_RUNNER_PASSWORD:?set DBT_RUNNER_PASSWORD in .env}
      ANALYTICS_RO_PASSWORD: ${ANALYTICS_RO_PASSWORD:?set ANALYTICS_RO_PASSWORD in .env}
      RAG_INDEXER_PASSWORD: ${RAG_INDEXER_PASSWORD:?set RAG_INDEXER_PASSWORD in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres runs these once, in filename order, on an empty data directory.
      # It aborts the whole startup on any error, which is why the ordering in
      # CONTRACTS.md §1 is create-before-grant rather than a convention.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Three assertions, and each one is load-bearing.
      #
      # pg_isready alone goes green as soon as the socket accepts connections.
      # During initdb the entrypoint runs a temporary server on the unix socket,
      # so a socket-only check reports healthy while 03..05 are still running —
      # and anything with `depends_on: service_healthy` then starts against a
      # half-built database. Asserting the LAST object the init sequence creates
      # (oltp.support_tickets, from 05) closes that window.
      #
      # pg_extension proves this image really is pgvector/pgvector:pg16 rather
      # than a plain postgres that would break the RAG layer much later.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d warehouse -q &&
          psql -U "$${POSTGRES_USER}" -d warehouse -tAc
          "select 1 from pg_extension where extname = 'vector'" | grep -q 1 &&
          psql -U "$${POSTGRES_USER}" -d oltp -tAc
          "select 1 where to_regclass('public.support_tickets') is not null" | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # MinIO — the object store standing in for S3. Phase 1 does not read from it;
  # it is here because the bucket layout in CONTRACTS.md §2 is a frozen
  # interface and Phase 2 should find it already correct.
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    profiles: [core, full]
    container_name: meridian-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # One-shot: create the lake bucket. Exits 0 and stays exited — `docker compose
  # ps` showing it as Exited(0) is success, not a failure.
  # --------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    profiles: [core, full]
    container_name: meridian-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LAKE_BUCKET: ${LAKE_BUCKET:-meridian-lake}
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing \"local/$${LAKE_BUCKET}\" &&
      mc ls local &&
      echo 'lake bucket ready'
      "
    restart: "no"

  # --------------------------------------------------------------------------
  # Airflow 3.1.3, LocalExecutor. CONTRACTS.md §6.
  #
  # Pinned to the exact patch, because Airflow's constraints branch is named per
  # patch — `constraints-3.1.x` does not exist, so "3.1" is not a thing you can
  # install reproducibly.
  #
  # LocalExecutor: no Celery, no Redis, no worker fleet. The DAGs here fan out to
  # at most five tasks and every one of them is a subprocess that shells out to
  # another interpreter, so a distributed executor would add three moving parts
  # to schedule work that a thread pool already handles.
  #
  # Airflow 3 splits what Airflow 2 called the webserver into an api-server, a
  # scheduler and a dag-processor. They are separate services here rather than
  # one container running three things, so a DAG parsing error cannot take the
  # scheduler down with it.
  # --------------------------------------------------------------------------
  airflow-init:
    <<: &airflow-common
      image: meridian-airflow:3.1.3
      build:
        context: .
        dockerfile: airflow/Dockerfile
      profiles: [full]
      depends_on:
        postgres:
          condition: service_healthy
      environment: &airflow-env
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
        AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
          postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
        AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
        AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
        # Local development only. Everyone who can reach the port is an admin,
        # which is acceptable for a stack bound to localhost and would not be
        # anywhere else.
        AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
        # Airflow 3 runs tasks through a Task Execution API rather than letting
        # them touch the metadata database directly. The worker resolves that
        # API from this setting, which defaults to localhost:8080 — correct for
        # an all-in-one host, wrong for every split deployment including this
        # one, where the api-server is a different container. Left unset, tasks
        # queue, retry, and fail with `httpx.ConnectError: Connection refused`
        # from inside the executor, which reads as a scheduler problem rather
        # than a URL.
        AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
        # DAG code is trusted here and parsing it is not a sandbox boundary.
        AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"

        # --- what the pipeline subprocesses read ---------------------------
        # The package lives in /opt/meridian-venv with no pyproject.toml above
        # it, so the usual walk-up cannot find the project root. Without this
        # every seeds/ and eval/ path resolves inside site-packages and the
        # failure is an empty result rather than an error.
        MERIDIAN_ROOT: /opt/meridian
        POSTGRES_HOST: postgres
        POSTGRES_PORT: "5432"
        MINIO_ENDPOINT: http://minio:9000
        MINIO_ROOT_USER: ${MINIO_ROOT_USER}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        LAKE_BUCKET: ${LAKE_BUCKET:-meridian-lake}
        MERIDIAN_APP_PASSWORD: ${MERIDIAN_APP_PASSWORD}
        MERIDIAN_ETL_PASSWORD: ${MERIDIAN_ETL_PASSWORD}
        DBT_RUNNER_PASSWORD: ${DBT_RUNNER_PASSWORD}
        ANALYTICS_RO_PASSWORD: ${ANALYTICS_RO_PASSWORD}
        RAG_INDEXER_PASSWORD: ${RAG_INDEXER_PASSWORD}
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
        ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
        RAG_ABSTAIN_SIMILARITY: ${RAG_ABSTAIN_SIMILARITY:-0.68}
      volumes:
        - ./airflow/dags:/opt/airflow/dags:ro
        # Mounted rather than baked: seeds are 23 MB of regenerable data, and the
        # governance file and golden question set are things you want to edit
        # without rebuilding a 4 GB image.
        - ./seeds:/opt/meridian/seeds:ro
        - ./docs:/opt/meridian/docs:ro
        - ./eval:/opt/meridian/eval:ro
        - ./contracts:/opt/meridian/contracts:ro
        - airflow-logs:/opt/airflow/logs
    container_name: meridian-airflow-init
    # `db migrate` is idempotent, so this runs on every `up` rather than being a
    # one-time step whose absence surfaces as an unexplained schema error.
    command: >-
      bash -c "airflow db migrate && echo 'airflow metadata database ready'"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: meridian-airflow-apiserver
    command: api-server
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: meridian-airflow-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    container_name: meridian-airflow-dag-processor
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
